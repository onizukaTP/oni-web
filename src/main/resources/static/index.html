<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OniWeb Framework Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { background: #1e293b; border-radius: 8px; padding: 2rem; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { color: #38bdf8; margin-top: 0; }
        code { background: #334155; padding: 0.2rem 0.4rem; border-radius: 4px; color: #f43f5e; }
        .endpoint { font-family: monospace; background: #0f172a; padding: 0.5rem; border-radius: 4px; margin: 0.5rem 0; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 OniWeb NIO Framework</h1>
        <p>Your ultra-fast Java NIO web framework is running successfully!</p>
        <h3>Available Endpoints:</h3>
        <span class="endpoint">GET /users</span>
        <span class="endpoint">GET /users/{id}</span>
        <span class="endpoint">POST /users</span>
        <span class="endpoint">PUT /users/{id}</span>
        <span class="endpoint">DELETE /users/{id}</span>
    </div>
</body>
</html>
